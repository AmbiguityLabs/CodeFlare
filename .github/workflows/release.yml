name: Build & Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0). Leave blank to auto-generate.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare keystores (zero-secrets fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          else
            echo "No KEYSTORE_BASE64 secret found; generating ephemeral release keystore with alias 'upload'."
            PASS="${STORE_PASSWORD:-edgecode-ci-release}"
            KEY_PASS="${KEY_PASSWORD:-$PASS}"
            keytool -genkeypair -noprompt \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "$PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=EdgeCode, OU=Release, O=EdgeCode, L=Cloud, ST=CI, C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'edgecode-ci-release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD || 'edgecode-ci-release' }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Package release artifacts
        id: release_meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="v1.0-build.${{ github.run_number }}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/EdgeCode-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/EdgeCode-${TAG}.aab"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgeCode-${{ steps.release_meta.outputs.tag }}
          path: release-artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: EdgeCode ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab

      - name: Clean up keystores
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks" "${{ github.workspace }}/debug.keystore"
