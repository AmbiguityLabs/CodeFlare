<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codeflare logo: flame top, neon heat</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5fb;--fg:#10122e;--mut:#5a5f86;--btn:#0736d8;--btnfg:#fff}
body{background:var(--bg)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d1e;--fg:#eef0ff;--mut:#a3a8d0;--glow:#fff}.row button{background:#23274d!important;color:#eef0ff!important}.row button[aria-pressed="true"]{background:var(--btn)!important}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:4px 0}
p{color:var(--mut);font-size:14px;margin:4px 0 14px}
.stage{background:transparent;aspect-ratio:1/1;display:grid;place-items:center;overflow:visible}
.logo{position:relative;height:84%;aspect-ratio:1228/1281}
.logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lay{display:contents}
#top{display:block}
.lay>path{fill-opacity:0;stroke:#3b6bff;stroke-width:5;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.play .lay>path{animation:draw .7s cubic-bezier(.65,0,.35,1) both,fillin .5s ease-out both,strk .4s ease-out both;animation-delay:calc(var(--i)*.35s),calc(var(--i)*.35s + .45s),calc(var(--i)*.35s + .65s)}
.glass,.glassv,.fx{opacity:0}
.play .glass,.play .glassv{animation:gin .6s ease-out 1.7s both}
.play .fx{animation:gin .6s ease-out 1.7s both}
.fx{display:none}
.f3{display:block}
.heat{mix-blend-mode:color}
#top{transform-box:view-box;transform-origin:601px 652px;filter:url(#fire)}
.play #top{animation:grow 4.6s linear 1.8s both}
@keyframes grow{0.0%{transform:scale(0.06,0.035)}7.14%{transform:scale(0.1015,0.1555)}14.29%{transform:scale(0.1721,0.2688)}21.43%{transform:scale(0.2564,0.3748)}28.57%{transform:scale(0.3478,0.4734)}35.71%{transform:scale(0.4419,0.5644)}42.86%{transform:scale(0.5354,0.6476)}50.0%{transform:scale(0.6257,0.7229)}57.14%{transform:scale(0.7105,0.79)}64.29%{transform:scale(0.7879,0.8488)}71.43%{transform:scale(0.8561,0.8988)}78.57%{transform:scale(0.9133,0.9397)}85.71%{transform:scale(0.9579,0.9709)}92.86%{transform:scale(0.9878,0.9917)}100.0%{transform:scale(1.0,1.0)}}
:root{--glow:#111;--lead:#8fb4ff}
.heatr{opacity:0}
.play .heatr{animation:heatvis 4.2s linear 2.2s both}
.play .f3{animation:fx3 5s linear 2.2s both}
.dg{opacity:0}
.dt{transform-box:fill-box;transform-origin:center;fill:var(--c)}
.play .dg{animation:fly 1.1s linear var(--d) both}
.csolid{opacity:0}
.play .dt{animation:wv 1.2s ease-in-out var(--p) infinite}
.play .csolid{animation:gin .35s ease-out 2.6s both}
.play .cdots{animation:dfade .3s ease-in 2.7s both}
@keyframes dfade{to{opacity:0}}
@keyframes fly{0%{opacity:0;transform:translate(var(--ox),var(--oy));animation-timing-function:cubic-bezier(.4,0,.8,.6)}12%{opacity:1}55%{transform:translate(calc(var(--ox)*-.1),calc(var(--oy)*-.1));animation-timing-function:ease-in-out}72%{transform:translate(calc(var(--ox)*.05),calc(var(--oy)*.05));animation-timing-function:ease-in-out}86%{transform:translate(calc(var(--ox)*-.02),calc(var(--oy)*-.02))}100%{opacity:1;transform:translate(0,0)}}
@keyframes wv{0%,100%{transform:scale(1.55);fill:var(--lead);fill-opacity:1}50%{transform:scale(.5);fill:var(--c);fill-opacity:.45}}
@keyframes rest{from{transform:scale(1.55);fill:var(--lead);fill-opacity:1}to{transform:scale(1.4);fill:var(--c);fill-opacity:1}}
@keyframes heatvis{from,to{opacity:1}}
@keyframes fx3{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}

.runner{animation:run 1.5s linear infinite}
.ember{animation:rise var(--t) ease-out var(--d) infinite;opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}
@keyframes strk{to{stroke-opacity:0}}
@keyframes gin{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes run{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--x),-110px) scale(.4)}}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:11px 10px;background:var(--btn);color:var(--btnfg);cursor:pointer;width:100%}
.row button{background:#e3e7fb;color:#10122e}
.row button[aria-pressed="true"]{background:var(--btn);color:var(--btnfg)}
#r{margin-top:10px}
@media (prefers-reduced-motion:reduce){.play #top,.play .heatr,.play .f3,.play .csolid,.play .cdots,.play .lay>path,.play .glass,.play .glassv,.play .fx{animation-duration:.01ms!important;animation-delay:0s!important}.runner,.ember,.play .dt{animation:none}.play .dg{animation:none;opacity:1}}

html.host-light{--bg:#f4f5fb;--fg:#10122e;--mut:#5a5f86;--glow:#111}
html.host-light .row button{background:#e3e7fb!important;color:#10122e!important}
html.host-light .row button[aria-pressed="true"]{background:var(--btn)!important;color:var(--btnfg)!important}
html.host-dark{--bg:#0b0d1e;--fg:#eef0ff;--mut:#a3a8d0;--glow:#fff}
html.host-dark .row button{background:#23274d!important;color:#eef0ff!important}
html.host-dark .row button[aria-pressed="true"]{background:var(--btn)!important;color:var(--btnfg)!important}
html.host-embed,html.host-embed body{background:transparent!important;min-height:100%;height:100%;overflow:hidden}
html.host-embed main{max-width:none;width:100%;height:100%;margin:0;padding:0;display:grid;place-items:center}
html.host-embed h1,html.host-embed p,html.host-embed #r{display:none!important}
html.host-embed .stage{width:min(100vw,100vh);height:min(100vw,100vh);max-width:100%;max-height:100%}
</style></head><body><main>

<script>
(function(){
  var params = new URLSearchParams(window.location.search || '');
  var themeParam = params.get('theme');
  var root = document.documentElement;
  if (themeParam === 'dark') {
    root.classList.add('host-dark');
  } else if (themeParam === 'light') {
    root.classList.add('host-light');
  }
  var isEmbed = params.get('embed') === '1';
  if (isEmbed) {
    root.classList.add('host-embed');
  }

  var s = document.getElementById('s');
  var r = document.getElementById('r');
  var speed = 1;
  var appliedSpeed = null;

  function fmt(sec) {
    var v = Math.max(0.001, sec);
    return Number(v.toFixed(4)) + 's';
  }
  function fmtSigned(sec) {
    return Number(sec.toFixed(4)) + 's';
  }

  function applyHardwareSpeed(rawFactor) {
    var f = parseFloat(rawFactor);
    if (!isFinite(f) || f <= 0) f = 1;
    if (f < 0.5) f = 0.5;
    if (f > 3.0) f = 3.0;
    speed = f;
    if (appliedSpeed !== null && Math.abs(appliedSpeed - f) < 0.001) {
      return;
    }
    appliedSpeed = f;

    var existing = document.getElementById('hw-speed-override');
    if (Math.abs(f - 1) < 0.001) {
      if (existing) existing.remove();
    } else {
      if (!existing) {
        existing = document.createElement('style');
        existing.id = 'hw-speed-override';
        document.head.appendChild(existing);
      }
      existing.textContent = [
        '.play .lay>path{animation-duration:' + fmt(0.7/f) + ',' + fmt(0.5/f) + ',' + fmt(0.4/f) + ';animation-delay:calc(var(--i)*' + fmt(0.35/f) + '),calc(var(--i)*' + fmt(0.35/f) + ' + ' + fmt(0.45/f) + '),calc(var(--i)*' + fmt(0.35/f) + ' + ' + fmt(0.65/f) + ')}',
        '.play .glass,.play .glassv,.play .fx{animation-duration:' + fmt(0.6/f) + ';animation-delay:' + fmt(1.7/f) + '}',
        '.play #top{animation-duration:' + fmt(4.6/f) + ';animation-delay:' + fmt(1.8/f) + '}',
        '.play .heatr{animation-duration:' + fmt(4.2/f) + ';animation-delay:' + fmt(2.2/f) + '}',
        '.play .f3{animation-duration:' + fmt(5.0/f) + ';animation-delay:' + fmt(2.2/f) + '}',
        '.play .dg{animation-duration:' + fmt(1.1/f) + '}',
        '.play .dt{animation-duration:' + fmt(1.2/f) + '}',
        '.play .csolid{animation-duration:' + fmt(0.35/f) + ';animation-delay:' + fmt(2.6/f) + '}',
        '.play .cdots{animation-duration:' + fmt(0.3/f) + ';animation-delay:' + fmt(2.7/f) + '}',
        '.runner{animation-duration:' + fmt(1.5/f) + '}'
      ].join('');
    }

    document.querySelectorAll('.dg').forEach(function(el) {
      if (!el.dataset.origD) {
        el.dataset.origD = el.style.getPropertyValue('--d') || '0s';
      }
      var baseD = parseFloat(el.dataset.origD);
      if (isFinite(baseD)) {
        el.style.setProperty('--d', fmtSigned(baseD / f));
      }
    });

    document.querySelectorAll('.dt').forEach(function(el) {
      if (!el.dataset.origP) {
        el.dataset.origP = el.style.getPropertyValue('--p') || '0s';
      }
      var baseP = parseFloat(el.dataset.origP);
      if (isFinite(baseP)) {
        el.style.setProperty('--p', fmtSigned(baseP / f));
      }
    });

    document.querySelectorAll('.ember').forEach(function(el) {
      if (!el.dataset.origT) {
        el.dataset.origT = el.style.getPropertyValue('--t') || '2s';
      }
      var baseT = parseFloat(el.dataset.origT);
      if (isFinite(baseT)) {
        el.style.setProperty('--t', fmt(baseT / f));
      }
    });

    document.querySelectorAll('svg animate, svg animateTransform').forEach(function(el) {
      if (!el.dataset.origDur) {
        el.dataset.origDur = el.getAttribute('dur') || '';
      }
      if (!el.dataset.origBegin) {
        el.dataset.origBegin = el.getAttribute('begin') || '';
      }
      var baseDur = parseFloat(el.dataset.origDur);
      if (isFinite(baseDur) && baseDur > 0) {
        el.setAttribute('dur', fmt(baseDur / f));
      }
      if (el.dataset.origBegin) {
        var baseBegin = parseFloat(el.dataset.origBegin);
        if (isFinite(baseBegin)) {
          el.setAttribute('begin', fmtSigned(baseBegin / f));
        }
      }
    });
  }

  function play() {
    if (!s) return;
    var v = document.querySelector('.logo svg');
    s.classList.remove('play');
    void s.offsetWidth;
    if (v) {
      try {
        if (v.unpauseAnimations) v.unpauseAnimations();
        if (v.setCurrentTime) {
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          v.setCurrentTime(reduced ? (7.2 / speed) : 0);
        }
      } catch (e) {}
    }
    s.classList.add('play');
  }

  window.play = play;
  window.setHardwareSpeed = function(factor, replayNow) {
    applyHardwareSpeed(factor);
    if (replayNow) play();
  };
  window.setHostTheme = function(isDark) {
    root.classList.remove('host-dark', 'host-light');
    root.classList.add(isDark ? 'host-dark' : 'host-light');
  };

  if (r) r.onclick = play;
  document.querySelectorAll('.row button').forEach(function(b) {
    b.onclick = function() {
      document.querySelectorAll('.row button').forEach(function(x) {
        x.setAttribute('aria-pressed', x === b);
      });
      if (s) {
        s.classList.remove('s1', 's2', 's3');
        s.classList.add('s' + b.dataset.s);
      }
      play();
    };
  });

  var initialSpeed = params.get('speed');
  applyHardwareSpeed(initialSpeed || 1);
  var startDelay = isEmbed ? 40 : Math.max(40, Math.round(300 / speed));
  setTimeout(play, startDelay);
})();
</script></body></html>
